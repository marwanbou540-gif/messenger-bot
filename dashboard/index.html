<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Madox Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="bg-mesh"></div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card glass">
    <div class="login-logo">🤖</div>
    <h1 class="login-title">Madox Dashboard</h1>
    <p class="login-sub">أدخل مفتاح API للدخول</p>
    <div class="login-form">
      <input type="password" id="loginKey" class="input" placeholder="API Key…" autocomplete="off"/>
      <button class="btn primary" id="loginBtn" onclick="doLogin()">دخول</button>
    </div>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🤖</span>
      <div>
        <div class="brand-name">Madox</div>
        <div class="brand-sub">Bot Dashboard v2.1</div>
      </div>
    </div>
    <div class="topbar-pills" id="topbarPills">
      <span class="pill warn" id="pillStatus">جاري الاتصال...</span>
      <span class="pill" id="pillGroups">0 مجموعة</span>
      <span class="pill" id="pillUptime">0s</span>
      <span class="pill" id="pillMem">RAM: —</span>
    </div>
    <button class="btn ghost" onclick="doLogout()">خروج</button>
  </header>

  <!-- TABS -->
  <nav class="tabs" id="tabBar"></nav>

  <!-- CONTENT -->
  <main id="content"></main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
